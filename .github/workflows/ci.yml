name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Use Google Chrome already installed on the hosted runner.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Live API calls remain opt-in and are never part of the default suite.
